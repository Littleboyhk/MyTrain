name: my_train
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.16.0
  geolocator: ^14.0.3
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.2
  google_fonts: ^8.2.0
  connectivity_plus: ^7.3.1
  audioplayers: ^6.8.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates the localization delegates from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/stations.json
    # Station coordinates for the nearest-station lookup, as { CODE: [lat, lng] }.
    # Built from the same DataMeet Indian Railways open dataset as
    # stations.json (which ships without geometry). 222 KB, 8,697 of 8,989
    # codes (96.8%); loaded lazily on first use, never at launch.
    - assets/data/station_coords.json
    - assets/data/junction_corridors.json
    - assets/branding/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Noto Sans faces for the Indic scripts used by the app's 13 locales.
  #
  # These are never set as a primary fontFamily — they are wired into every text
  # style as `fontFamilyFallback` (see AppTheme.indicFontFallback), so Roboto
  # still draws Latin and Noto only supplies glyphs Roboto lacks.
  #
  # Static Regular + Bold per script (no variable fonts): the app's text styles
  # span w500-w800, which Flutter resolves to the nearest declared weight.
  # 9 scripts x 2 weights = 18 files, ~2.7 MB uncompressed. See the size notes in
  # the fix report before adding more weights.
  fonts:
    - family: NotoSansDevanagari # hi, mr
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam # ml
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansTamil # ta
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansKannada # kn
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
    - family: NotoSansTelugu # te
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansBengali # bn, as
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSansGujarati # gu
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
    - family: NotoSansGurmukhi # pa
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
        - asset: assets/fonts/NotoSansGurmukhi-Bold.ttf
          weight: 700
    - family: NotoSansOriya # or
      fonts:
        - asset: assets/fonts/NotoSansOriya-Regular.ttf
        - asset: assets/fonts/NotoSansOriya-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
